<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Contact | Campus Bites</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">Campus Bites</a>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="deals.html">Deals</a>
                <a href="order.html">How to Order</a>
                <a href="feedback.html" class="active" aria-current="page">Feedback</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- ===== FEEDBACK PAGE (Member 4) ===== -->
        <h1 class="page-title">Feedback &amp; Contact</h1>

        <section class="grid">
            <article class="card">
                <h2>Contact us</h2>
                <ul class="plain">
                    <li><strong>Phone:</strong> 042-1234567</li>
                    <li><strong>Email:</strong> info@campusbites.example</li>
                    <li><strong>Address:</strong> Ground Floor, Main Academic Block</li>
                </ul>
            </article>

            <article class="card">
                <h2>Send feedback</h2>
                <!-- Static form: no backend required -->
                <form class="feedback-form" action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit" class="btn">Send feedback</button>
                </form>
            </article>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Campus Bites &middot; University of Central Punjab</p>
        </div>
    </footer>

</body>

</html>
